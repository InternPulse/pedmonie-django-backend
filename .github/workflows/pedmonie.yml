name: Pedmonie CI/CD

on: [push, pull_request]

jobs:
  test:
    name: Run Django Tests
    runs-on: ubuntu-latest

    env:
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      EMAIL_HOST_USER : ${{ secrets.EMAIL_HOST_USER }}
      EMAIL_HOST_PASSWORD : ${{ secrets.EMAIL_HOST_PASSWORD }}
      FROM_EMAIL : ${{ secrets.FROM_EMAIL }}
      FRONTEND_URL : ${{ secrets.FRONTEND_URL }}
      REDIS_CACHE_BACKEND: ${{ secrets.REDIS_CACHE_BACKEND }}
      REDIS_CACHE_LOCATION: ${{ secrets.REDIS_CACHE_LOCATION }}
      REDIS_DB : ${{ secrets.REDIS_DB }}
      REDIS_HOST : ${{ secrets.REDIS_HOST }}
      REDIS_PASSWORD : ${{ secrets.REDIS_PASSWORD }}
      REDIS_PORT : ${{ secrets.REDIS_PORT }}
      REDIS_USERNAME : ${{ secrets.REDIS_USERNAME }}
      EMAIL_VERIFICATION_TIMEOUT : ${{ secrets.EMAIL_VERIFICATION_TIMEOUT }}
      VERIFICATION_CODE_LENGTH : ${{ secrets.VERIFICATION_CODE_LENGTH }}


    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'  

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  

      - name: Run Django Migrations
        run: python manage.py migrate

      - name: Run Django Unittests
        env:
          DJANGO_SETTINGS_MODULE: pedmonie.settings 
        run: |
          python manage.py test
